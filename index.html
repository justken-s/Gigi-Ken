<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <!--
        viewport-fit=cover → el contenido puede llegar hasta los bordes
        físicos del iPhone (Dynamic Island, esquinas redondeadas).
        Controlamos los márgenes de seguridad con env(safe-area-inset-*)
        en el CSS en lugar de dejar que iOS los recorte automáticamente.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050510">
    <title>Nuestra Constelación - Gigi</title>
 
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="preload" as="image" href="assets/images/Fondo_Universo.jpg">
</head>
 
<body>
 
    <audio id="bg-music" loop preload="metadata">
        <source
            src="https://res.cloudinary.com/dfi8emygz/video/upload/q_auto/f_auto/v1777105059/Great_Fairy_Fountain_m6nhsl.mp3"
            type="audio/mpeg">
    </audio>
 
    <button id="music-control" aria-label="Controlar música">🔇</button>
 
    <header>
        <h1>Gigi y Ken</h1>
        <p>Cada momento es una estrella en nuestro cielo...</p>
        <h2 id="counter-display"></h2>
    </header>
 
    <main id="constellation-map"></main>
 
    <div id="photo-overlay" class="hidden" role="dialog" aria-modal="true">
        <button id="close-overlay" aria-label="Cerrar">&times;</button>
 
        <div class="photo-container" id="swipe-card" draggable="false">
            <div class="protector-wrapper">
                <img id="overlay-img" src="" alt="" decoding="async">
            </div>
            <p id="overlay-note"></p>
        </div>
    </div>
 
    <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="main.js"></script>
 
</body>
 
</html>
